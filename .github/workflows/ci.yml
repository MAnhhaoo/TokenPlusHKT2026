name: CI

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'BE/**'
      - 'FE/user/**'
      - 'FE/admin/**'
      - 'ML/**'
      - 'ml/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'firebase.json'
  workflow_call:
    outputs:
      backend:
        description: Whether a migrated backend package is present.
        value: ${{ jobs.changes.outputs.backend }}
      user:
        description: Whether a migrated user frontend package is present.
        value: ${{ jobs.changes.outputs.user }}
      admin:
        description: Whether a migrated admin frontend package is present.
        value: ${{ jobs.changes.outputs.admin }}
      ml:
        description: Whether a migrated ML package is present.
        value: ${{ jobs.changes.outputs.ml }}
      any_application:
        description: Whether any application package is present.
        value: ${{ jobs.changes.outputs.any_application }}
    inputs:
      full_validation:
        description: Validate every migrated application package before deployment.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_validation:
        description: Validate every migrated application package on this branch.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect migrated packages
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      user: ${{ steps.detect.outputs.user }}
      admin: ${{ steps.detect.outputs.admin }}
      ml: ${{ steps.detect.outputs.ml }}
      any_application: ${{ steps.detect.outputs.any_application }}
      any_node: ${{ steps.detect.outputs.any_node }}
      node_components: ${{ steps.detect.outputs.node_components }}
      ml_components: ${{ steps.detect.outputs.ml_components }}
      source_user: ${{ steps.detect.outputs.source_user }}
      source_admin: ${{ steps.detect.outputs.source_admin }}
      source_any_application: ${{ steps.detect.outputs.source_any_application }}
      source_node_files: ${{ steps.detect.outputs.source_node_files }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Identify changed application paths
        id: detect
        shell: bash
        env:
          FULL_VALIDATION: ${{ inputs.full_validation }}
        run: |
          set -euo pipefail

          if [[ "$FULL_VALIDATION" == true ]]; then
            changed_files="$(git ls-files | grep -vE '(^|/)\.gitkeep$' || true)"
            case "$GITHUB_EVENT_NAME" in
              push)
                before="$(jq -r '.before' "$GITHUB_EVENT_PATH")"
                if [[ "$before" =~ ^0+$ ]]; then
                  source_changed_files="$changed_files"
                else
                  source_changed_files="$(git diff --name-only "$before" "$GITHUB_SHA")"
                fi
                ;;
              release|workflow_dispatch)
                parent="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
                if [[ -n "$parent" ]]; then
                  source_changed_files="$(git diff --name-only "$parent" "$GITHUB_SHA")"
                else
                  source_changed_files="$changed_files"
                fi
                ;;
              *) source_changed_files="$changed_files" ;;
            esac
          else
            case "$GITHUB_EVENT_NAME" in
              pull_request)
                base="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
                head="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
                ;;
              workflow_dispatch)
                head="$GITHUB_SHA"
                base="$(git rev-parse "${head}^" 2>/dev/null || git rev-list --max-parents=0 "$head" | tail -n 1)"
                ;;
              *)
                echo "Unsupported event without full_validation: $GITHUB_EVENT_NAME" >&2
                exit 1
                ;;
            esac

            changed_files="$(git diff --name-only "$base...$head")"
            source_changed_files="$changed_files"
          fi
          has_source_files() {
            git ls-files "$1" | grep -qvE '(^|/)\.gitkeep$'
          }
          has_changed_source() {
            local directory="$1"
            local files="${2:-$changed_files}"
            while IFS= read -r file; do
              if [[ "$file" == "$directory/"* && "${file##*/}" != .gitkeep ]]; then
                return 0
              fi
            done <<<"$files"
            return 1
          }

          source_backend=false
          source_user=false
          source_admin=false
          source_ml=false
          has_changed_source BE "$source_changed_files" && source_backend=true || true
          has_changed_source FE/user "$source_changed_files" && source_user=true || true
          has_changed_source FE/admin "$source_changed_files" && source_admin=true || true
          for directory in ml ML; do
            has_changed_source "$directory" "$source_changed_files" && source_ml=true || true
          done
          if grep -Eq '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$' <<<"$source_changed_files"; then
            has_source_files BE && source_backend=true || true
            has_source_files FE/user && source_user=true || true
            has_source_files FE/admin && source_admin=true || true
          fi
          source_any_application=false
          [[ "$source_backend" == true || "$source_user" == true || "$source_admin" == true || "$source_ml" == true ]] && source_any_application=true

          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] && grep -qE '^\.github/workflows/' <<<"$source_changed_files"; then
            changed_files="$(git ls-files | grep -vE '(^|/)\.gitkeep$' || true)"
          fi

          backend=false
          user=false
          admin=false
          ml=false
          ml_components=()

          has_changed_source BE && backend=true || true
          has_changed_source FE/user && user=true || true
          has_changed_source FE/admin && admin=true || true
          for directory in ml ML; do
            if has_changed_source "$directory"; then
              ml=true
              ml_components+=("$directory")
            fi
          done

          # A shared pnpm manifest or lockfile affects every migrated Node package.
          if grep -Eq '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$' <<<"$changed_files"; then
            has_source_files BE && backend=true || true
            has_source_files FE/user && user=true || true
            has_source_files FE/admin && admin=true || true
          fi

          any_node=false
          any_application=false
          node_components=()
          [[ "$backend" == true ]] && node_components+=(BE)
          [[ "$user" == true ]] && node_components+=(FE/user)
          [[ "$admin" == true ]] && node_components+=(FE/admin)
          [[ ${#node_components[@]} -gt 0 ]] && any_node=true
          [[ "$backend" == true || "$user" == true || "$admin" == true || "$ml" == true ]] && any_application=true

          node_json='["__none__"]'
          if [[ ${#node_components[@]} -gt 0 ]]; then
            node_json="$(printf '%s\n' "${node_components[@]}" | jq -R . | jq -s -c .)"
          fi
          node_source_files=()
          while IFS= read -r file; do
            case "$file" in
              BE/*|FE/user/*|FE/admin/*) node_source_files+=("$file") ;;
            esac
          done <<<"$source_changed_files"
          node_files_json='[]'
          if [[ ${#node_source_files[@]} -gt 0 ]]; then
            node_files_json="$(printf '%s\n' "${node_source_files[@]}" | jq -R . | jq -s -c .)"
          fi
          ml_json='["__none__"]'
          if [[ ${#ml_components[@]} -gt 0 ]]; then
            ml_json="$(printf '%s\n' "${ml_components[@]}" | jq -R . | jq -s -c .)"
          fi
          {
            echo "backend=$backend"
            echo "user=$user"
            echo "admin=$admin"
            echo "ml=$ml"
            echo "any_node=$any_node"
            echo "any_application=$any_application"
            echo "node_components=$node_json"
            echo "ml_components=$ml_json"
            echo "source_user=$source_user"
            echo "source_admin=$source_admin"
            echo "source_any_application=$source_any_application"
            echo "source_node_files=$node_files_json"
          } >> "$GITHUB_OUTPUT"

          printf '{"user":%s,"admin":%s}\n' \
            "$source_user" "$source_admin" > "$RUNNER_TEMP/ci-scope.json"

      - name: Upload CI scope for trusted preview workflow
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.GCP_PREVIEW_ENABLED == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-scope
          path: ${{ runner.temp }}/ci-scope.json
          if-no-files-found: error
          retention-days: 1

  preflight:
    name: Package readiness
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Explain which checks can run
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ needs.changes.outputs.any_application }}" != "true" ]]; then
            {
              echo '## CI readiness'
              echo
              echo 'No migrated application package is in scope. Build, typecheck, lint, and test were not run; this workflow run does not validate application code.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Application packages are in scope; validating required package manifests and scripts.'
          fi

          for component in BE FE/user FE/admin; do
            if ! git ls-files "$component" | grep -qvE '(^|/)\.gitkeep$'; then
              echo "::notice title=Not migrated::$component has no tracked application source yet."
            fi
          done
          if [[ ! -f ml/pyproject.toml && ! -f ML/pyproject.toml ]]; then
            echo '::notice title=Not migrated::No ml/ or ML/ Python package exists yet.'
          fi

      - name: Require runnable Node packages for changed Node paths
        if: needs.changes.outputs.any_node == 'true'
        shell: bash
        run: |
          set -euo pipefail
          components='${{ needs.changes.outputs.node_components }}'
          while IFS= read -r component; do
            [[ -n "$component" ]] || continue
            manifest="$component/package.json"
            if [[ ! -f "$manifest" ]]; then
              echo "::error title=Missing package manifest::$component changed but $manifest is missing."
              exit 1
            fi
            node - "$manifest" "$component" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const [manifest, component] = process.argv.slice(2);
          const pkg = JSON.parse(fs.readFileSync(manifest, 'utf8'));
          const scripts = pkg.scripts ?? {};
          const missing = ['build', 'typecheck'].filter((name) => !scripts[name]);
          if (!fs.existsSync(path.join(path.dirname(manifest), 'package-lock.json'))) {
            for (const file of ['package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml']) {
              if (!fs.existsSync(file)) missing.push(file);
            }
            const rootPkg = fs.existsSync('package.json')
              ? JSON.parse(fs.readFileSync('package.json', 'utf8'))
              : {};
            if (rootPkg.packageManager !== 'pnpm@12.15.0') missing.push('packageManager: pnpm@12.15.0');
          }
          if (!scripts.lint && !scripts.format) missing.push('lint or format script');
          if (!scripts.test && !scripts['test:smoke']) missing.push('test or test:smoke script');
          if (missing.length) {
            console.error(`${component}/package.json is not CI-ready; missing ${missing.join(', ')}.`);
            process.exit(1);
          }
          NODE
          done < <(jq -r '.[]' <<<"$components")

      - name: Require runnable ML package for changed ML paths
        if: needs.changes.outputs.ml == 'true'
        shell: bash
        run: |
          set -euo pipefail
          components='${{ needs.changes.outputs.ml_components }}'
          while IFS= read -r component; do
            [[ -n "$component" && "$component" != __none__ ]] || continue
            for file in "$component/pyproject.toml" "$component/uv.lock"; do
              if [[ ! -f "$file" ]]; then
                echo "::error title=Missing ML package file::$file is required because $component source changed."
                exit 1
              fi
            done
          done < <(jq -r '.[]' <<<"$components")

  node-checks:
    name: Node checks (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [changes, preflight]
    if: needs.preflight.result == 'success' && needs.changes.outputs.any_node == 'true'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.node_components) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Install locked package dependencies
        env:
          COMPONENT: ${{ matrix.component }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$COMPONENT/package-lock.json" ]]; then
            (cd "$COMPONENT" && npm ci)
          else
            pnpm install --frozen-lockfile
          fi

      - name: Build, typecheck, lint, and test
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE_NODE_FILES: ${{ needs.changes.outputs.source_node_files }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$COMPONENT"
          if [[ -f package-lock.json ]]; then
            package_manager=npm
            package_run() { npm run "$1" -- "${@:2}"; }
            has_script() { node -e "const p=require('./package.json'); process.exit(p.scripts?.['$1'] ? 0 : 1)"; }
          else
            package_manager=pnpm
            package_run() { pnpm run "$1" -- "${@:2}"; }
            has_script() { node -e "const p=require('./package.json'); process.exit(p.scripts?.['$1'] ? 0 : 1)"; }
          fi

          package_run build
          package_run typecheck
          if has_script lint; then
            package_run lint
          else
            mapfile -t format_files < <(jq -r '.[]' <<<"$SOURCE_NODE_FILES" | while IFS= read -r file; do
              [[ "$file" == "$COMPONENT/"* ]] || continue
              relative_path="${file#"$COMPONENT/"}"
              [[ -f "$relative_path" ]] || continue
              case "$relative_path" in
                *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx|*.json|*.css|*.scss|*.html|*.md) printf '%s\n' "$relative_path" ;;
              esac
            done)
            if [[ ${#format_files[@]} -gt 0 ]]; then
              package_run format --check "${format_files[@]}"
            else
              echo 'No changed formatter-supported source files; format check skipped.'
            fi
          fi

          if has_script test; then
            package_run test
          elif [[ "$COMPONENT" == FE/admin ]]; then
            if [[ "$package_manager" == npm ]]; then
              npx playwright install --with-deps chromium
              npm run preview -- --host 127.0.0.1 --port 4174 > "$RUNNER_TEMP/admin-preview.log" 2>&1 &
            else
              pnpm exec playwright install --with-deps chromium
              pnpm run preview -- --host 127.0.0.1 --port 4174 > "$RUNNER_TEMP/admin-preview.log" 2>&1 &
            fi
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 30); do
              curl --fail --silent http://127.0.0.1:4174/ >/dev/null && break
              sleep 1
            done
            curl --fail --silent --show-error http://127.0.0.1:4174/ >/dev/null
            ADMIN_URL=http://127.0.0.1:4174 package_run test:smoke
          else
            package_run test:smoke
          fi

      - name: Upload frontend preview artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.GCP_PREVIEW_ENABLED == 'true' && (matrix.component == 'FE/user' || matrix.component == 'FE/admin')
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hosting-${{ matrix.component == 'FE/user' && 'user' || 'admin' }}
          path: ${{ matrix.component }}/dist
          if-no-files-found: error
          retention-days: 1

  ml-checks:
    name: ML checks (${{ matrix.component }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes, preflight]
    if: needs.preflight.result == 'success' && needs.changes.outputs.ml == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        component: ${{ fromJSON(needs.changes.outputs.ml_components) }}
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.6
          python-version: '3.12'

      - name: Check ML lockfile
        run: uv lock --check

      - name: Install locked ML dependencies
        run: uv sync --locked --group dev

      - name: Lint ML package
        run: uv run ruff check .

      - name: Check ML formatting
        run: uv run ruff format --check .

      - name: Test ML package
        run: uv run pytest -q

  ci-summary:
    name: CI result
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, preflight, node-checks, ml-checks]
    steps:
      - name: Report validation status
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          NODE_RESULT: ${{ needs.node-checks.result }}
          ML_RESULT: ${{ needs.ml-checks.result }}
          APPLICATION_CHANGED: ${{ needs.changes.outputs.any_application }}
          SOURCE_APPLICATION_CHANGED: ${{ needs.changes.outputs.source_any_application }}
          FRONTEND_CHANGED: ${{ needs.changes.outputs.source_user == 'true' || needs.changes.outputs.source_admin == 'true' }}
          PREVIEW_ENABLED: ${{ vars.GCP_PREVIEW_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != success || "$PREFLIGHT_RESULT" != success || "$NODE_RESULT" == failure || "$NODE_RESULT" == cancelled || "$ML_RESULT" == failure || "$ML_RESULT" == cancelled ]]; then
            echo 'CI validation failed. See the failed package job for details.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ "$EVENT_NAME" == pull_request && "$FRONTEND_CHANGED" == true ]]; then
            if [[ "$PR_REPOSITORY" != "$REPOSITORY" ]]; then
              echo 'Firebase PR preview is disabled for fork pull requests; no cloud credentials were used.' >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$PREVIEW_ENABLED" != true ]]; then
              echo 'Firebase PR preview is not configured; no cloud credentials were used.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'A trusted deploy workflow will publish the frontend artifact to a temporary Firebase preview channel.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          if [[ "$SOURCE_APPLICATION_CHANGED" != true ]]; then
            if [[ "$APPLICATION_CHANGED" == true ]]; then
              echo 'No application source changed; workflow changes triggered full regression checks for migrated packages.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'No application source changed and no migrated packages were in scope; this run is not an application validation.' >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          echo 'All checks for changed application packages completed successfully.' >> "$GITHUB_STEP_SUMMARY"
