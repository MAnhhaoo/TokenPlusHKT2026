services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saigondrain_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: saigondrain_isolated_test
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U saigondrain_test -d saigondrain_isolated_test",
        ]
      interval: 2s
      timeout: 2s
      retries: 20
